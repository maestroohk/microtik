# Kibo queries. Authorization decisions are computed by radius.check_items / radius.reply_items
# (see the EF migration "RadiusFunctions"). The NAS is identified by packet source address,
# so a username is only ever looked up inside the tenant that owns the router.

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

sql_user_name = "%{User-Name}"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius.check_items('%{SQL-User-Name}', '%{Packet-Src-IP-Address}', '%{Service-Type}', '%{Calling-Station-Id}')"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius.reply_items('%{SQL-User-Name}', '%{Packet-Src-IP-Address}', '%{Service-Type}', '%{Calling-Station-Id}')"

simul_count_query = "SELECT radius.simultaneous_sessions('%{SQL-User-Name}', '%{Packet-Src-IP-Address}')"

event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-0}"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	account_call = "SELECT radius.account( 		'%{Acct-Status-Type}', '%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', 		'%{Packet-Src-IP-Address}', '%{%{NAS-Port-Id}:-%{NAS-Port}}', %{%{Acct-Session-Time}:-0}, 		%{%{Acct-Input-Octets}:-0}, %{%{Acct-Input-Gigawords}:-0}, %{%{Acct-Output-Octets}:-0}, %{%{Acct-Output-Gigawords}:-0}, 		'%{Called-Station-Id}', '%{Calling-Station-Id}', '%{Acct-Terminate-Cause}', '%{Framed-IP-Address}', '%{Class}', 		${..event_timestamp_epoch})"

	type {
		accounting-on {
			query = "${...account_call}"
		}

		accounting-off {
			query = "${...account_call}"
		}

		start {
			query = "${...account_call}"
		}

		interim-update {
			query = "${...account_call}"
		}

		stop {
			query = "${...account_call}"
		}
	}
}

post-auth {
	reference = ".query"
	query = "\
		INSERT INTO radius.radpostauth (username, reply, callingstationid, nasipaddress, authdate) \
		VALUES ('%{SQL-User-Name}', '%{reply:Packet-Type}', '%{Calling-Station-Id}', \
			'%{Packet-Src-IP-Address}', now())"
}
