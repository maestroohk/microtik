# Kibo queries. Authorization decisions are computed by radius.check_items / radius.reply_items
# (see the EF migration "RadiusFunctions"). The NAS is identified by packet source address,
# so a username is only ever looked up inside the tenant that owns the router.

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

sql_user_name = "%{User-Name}"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius.check_items('%{SQL-User-Name}', '%{Packet-Src-IP-Address}')"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius.reply_items('%{SQL-User-Name}', '%{Packet-Src-IP-Address}')"

simul_count_query = "\
	SELECT COUNT(*) FROM radius.radacct a \
	JOIN radius.nas n ON n.nas_name = a.nasipaddress \
	WHERE a.username = '%{SQL-User-Name}' \
	AND a.acctstoptime IS NULL \
	AND COALESCE(a.acctupdatetime, a.acctstarttime) > now() - interval '5 minutes' \
	AND n.tenant_id = (SELECT tenant_id FROM radius.nas WHERE nas_name = '%{Packet-Src-IP-Address}')"

event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-%l}"
event_timestamp = "TO_TIMESTAMP(${event_timestamp_epoch})"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	column_list = "acctsessionid, acctuniqueid, username, nasipaddress, nasportid, \
		acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, \
		acctinputoctets, acctoutputoctets, calledstationid, callingstationid, \
		acctterminatecause, framedipaddress, class"

	type {
		accounting-on {
			query = "\
				UPDATE radius.radacct SET \
					acctstoptime = ${....event_timestamp}, \
					acctterminatecause = 'NAS-Reboot' \
				WHERE nasipaddress = '%{Packet-Src-IP-Address}' AND acctstoptime IS NULL"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		start {
			query = "\
				INSERT INTO radius.radacct (${...column_list}) VALUES ( \
					'%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{%{NAS-Port-Id}:-%{NAS-Port}}', \
					${....event_timestamp}, ${....event_timestamp}, NULL, 0, 0, 0, \
					'%{Called-Station-Id}', '%{Calling-Station-Id}', '', \
					NULLIF('%{Framed-IP-Address}', ''), NULLIF('%{Class}', '')) \
				ON CONFLICT (acctuniqueid) DO NOTHING"
		}

		interim-update {
			query = "\
				INSERT INTO radius.radacct (${...column_list}) VALUES ( \
					'%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{%{NAS-Port-Id}:-%{NAS-Port}}', \
					${....event_timestamp} - make_interval(secs => %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, NULL, %{%{Acct-Session-Time}:-0}, \
					(%{%{Acct-Input-Gigawords}:-0}::bigint << 32) + %{%{Acct-Input-Octets}:-0}::bigint, \
					(%{%{Acct-Output-Gigawords}:-0}::bigint << 32) + %{%{Acct-Output-Octets}:-0}::bigint, \
					'%{Called-Station-Id}', '%{Calling-Station-Id}', '', \
					NULLIF('%{Framed-IP-Address}', ''), NULLIF('%{Class}', '')) \
				ON CONFLICT (acctuniqueid) DO UPDATE SET \
					acctupdatetime = GREATEST(radius.radacct.acctupdatetime, EXCLUDED.acctupdatetime), \
					acctsessiontime = GREATEST(radius.radacct.acctsessiontime, EXCLUDED.acctsessiontime), \
					acctinputoctets = GREATEST(radius.radacct.acctinputoctets, EXCLUDED.acctinputoctets), \
					acctoutputoctets = GREATEST(radius.radacct.acctoutputoctets, EXCLUDED.acctoutputoctets), \
					framedipaddress = COALESCE(EXCLUDED.framedipaddress, radius.radacct.framedipaddress)"
		}

		stop {
			query = "\
				INSERT INTO radius.radacct (${...column_list}) VALUES ( \
					'%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{%{NAS-Port-Id}:-%{NAS-Port}}', \
					${....event_timestamp} - make_interval(secs => %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, ${....event_timestamp}, %{%{Acct-Session-Time}:-0}, \
					(%{%{Acct-Input-Gigawords}:-0}::bigint << 32) + %{%{Acct-Input-Octets}:-0}::bigint, \
					(%{%{Acct-Output-Gigawords}:-0}::bigint << 32) + %{%{Acct-Output-Octets}:-0}::bigint, \
					'%{Called-Station-Id}', '%{Calling-Station-Id}', '%{Acct-Terminate-Cause}', \
					NULLIF('%{Framed-IP-Address}', ''), NULLIF('%{Class}', '')) \
				ON CONFLICT (acctuniqueid) DO UPDATE SET \
					acctupdatetime = EXCLUDED.acctupdatetime, \
					acctstoptime = COALESCE(radius.radacct.acctstoptime, EXCLUDED.acctstoptime), \
					acctsessiontime = GREATEST(radius.radacct.acctsessiontime, EXCLUDED.acctsessiontime), \
					acctinputoctets = GREATEST(radius.radacct.acctinputoctets, EXCLUDED.acctinputoctets), \
					acctoutputoctets = GREATEST(radius.radacct.acctoutputoctets, EXCLUDED.acctoutputoctets), \
					acctterminatecause = EXCLUDED.acctterminatecause"
		}
	}
}

post-auth {
	reference = ".query"
	query = "\
		INSERT INTO radius.radpostauth (username, reply, callingstationid, nasipaddress, authdate) \
		VALUES ('%{SQL-User-Name}', '%{reply:Packet-Type}', '%{Calling-Station-Id}', \
			'%{Packet-Src-IP-Address}', now())"
}
