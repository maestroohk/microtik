name: kibo-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kibo
      POSTGRES_USER: kibo
      POSTGRES_PASSWORD: ${KIBO_DB_PASSWORD:?set KIBO_DB_PASSWORD in deploy/.env}
      KIBO_RADIUS_DB_PASSWORD: ${KIBO_RADIUS_DB_PASSWORD:?set KIBO_RADIUS_DB_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kibo-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kibo -d kibo"]
      interval: 5s
      timeout: 3s
      retries: 20

  freeradius:
    image: freeradius/freeradius-server:3.2.7
    entrypoint: ["/bin/sh", "/kibo/start.sh"]
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KIBO_RADIUS_DB_PASSWORD: ${KIBO_RADIUS_DB_PASSWORD:?set KIBO_RADIUS_DB_PASSWORD in deploy/.env}
      KIBO_RADIUS_DB_HOST: 10.247.0.5
      KIBO_RADIUS_CLIENT_NETWORK: 10.247.0.0/24
      KIBO_RADIUS_DEBUG: ${KIBO_RADIUS_DEBUG:-}
    volumes:
      - ./freeradius:/kibo:ro
    ports:
      - "127.0.0.1:51812:1812/udp"
      - "127.0.0.1:51813:1813/udp"
      - "127.0.0.1:3799:3799/udp"
      - "127.0.0.1:3800:3800/udp"
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.10

  router-sim-1:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    working_dir: /app
    command: ["dotnet", "Kibo.Lab.dll"]
    volumes:
      - ../lab/sim-publish:/app:ro
    cpus: 0.5
    mem_limit: 256m
    environment:
      Sim__Identity: lab-sim-kampala
      Sim__ApiUsername: kibo-api
      Sim__ApiPassword: ${KIBO_SIM_API_PASSWORD:?set KIBO_SIM_API_PASSWORD in deploy/.env}
      Sim__RadiusServer: 10.247.0.10
      Sim__RadiusSecret: ${KIBO_SIM_RADIUS_SECRET_1:?set KIBO_SIM_RADIUS_SECRET_1 in deploy/.env}
      Sim__NasIpAddress: 10.247.0.21
      Sim__PublicBaseUrl: http://localhost:58721
      Sim__PortalBaseUrl: http://localhost:5290
      Sim__PortalSiteSlug: kampala-connect-ntinda
      Sim__MomoApiKey: ${KIBO_SIM_MOMO_API_KEY}
      Sim__MomoCallbackSecret: ${KIBO_SIM_MOMO_CALLBACK_SECRET}
      ASPNETCORE_URLS: http://+:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:58721:8080"
      - "127.0.0.1:53721:3799/udp"
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.21

  router-sim-2:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    working_dir: /app
    command: ["dotnet", "Kibo.Lab.dll"]
    volumes:
      - ../lab/sim-publish:/app:ro
    cpus: 0.5
    mem_limit: 256m
    environment:
      Sim__Identity: lab-sim-entebbe
      Sim__ApiUsername: kibo-api
      Sim__ApiPassword: ${KIBO_SIM_API_PASSWORD}
      Sim__RadiusServer: 10.247.0.10
      Sim__RadiusSecret: ${KIBO_SIM_RADIUS_SECRET_2:?set KIBO_SIM_RADIUS_SECRET_2 in deploy/.env}
      Sim__NasIpAddress: 10.247.0.22
      Sim__PublicBaseUrl: http://localhost:58722
      Sim__PortalBaseUrl: http://localhost:5290
      Sim__PortalSiteSlug: kampala-connect-entebbe-road
      Sim__MomoApiKey: ${KIBO_SIM_MOMO_API_KEY}
      Sim__MomoCallbackSecret: ${KIBO_SIM_MOMO_CALLBACK_SECRET}
      ASPNETCORE_URLS: http://+:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:58722:8080"
      - "127.0.0.1:53722:3799/udp"
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.22

  chr-1:
    profiles: ["chr"]
    build:
      context: ../lab/chr
    cap_add: [NET_ADMIN, SYS_ADMIN]
    devices:
      - /dev/net/tun
    cpus: 1.0
    mem_limit: 768m
    environment:
      CHR_VERSION: "7.25"
      CHR_NAME: lab-chr-1
      CHR_LAN_PREFIX: "10.5.61"
      CHR_MAC: "52:54:00:4b:00:31"
      CHR_ADMIN_PASSWORD: ${KIBO_CHR_ADMIN_PASSWORD:?set KIBO_CHR_ADMIN_PASSWORD in deploy/.env}
      CHR_API_USER: kibo-api
      CHR_API_PASSWORD: ${KIBO_CHR_API_PASSWORD:?set KIBO_CHR_API_PASSWORD in deploy/.env}
    volumes:
      - ../lab/chr/images:/images:ro
      - chr-1-data:/data
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.31

  chr-2:
    profiles: ["chr"]
    build:
      context: ../lab/chr
    cap_add: [NET_ADMIN, SYS_ADMIN]
    devices:
      - /dev/net/tun
    cpus: 1.0
    mem_limit: 512m
    environment:
      CHR_VERSION: "7.24.6"
      CHR_NAME: lab-chr-2
      CHR_LAN_PREFIX: "10.5.62"
      CHR_MAC: "52:54:00:4b:00:32"
      CHR_ADMIN_PASSWORD: ${KIBO_CHR_ADMIN_PASSWORD:?set KIBO_CHR_ADMIN_PASSWORD in deploy/.env}
      CHR_API_USER: kibo-api
      CHR_API_PASSWORD: ${KIBO_CHR_API_PASSWORD:?set KIBO_CHR_API_PASSWORD in deploy/.env}
    volumes:
      - ../lab/chr/images:/images:ro
      - chr-2-data:/data
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.32

  lab-files:
    profiles: ["chr"]
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache busybox-extras >/dev/null && mkdir -p /www && head -c 52428800 /dev/urandom > /www/50mb.bin && echo kibo-lab-ok > /www/index.html && busybox-extras httpd -f -p 80 -h /www"]
    cpus: 0.25
    mem_limit: 128m
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.50

  lab-dns:
    profiles: ["chr"]
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null; exec dnsmasq --no-daemon --log-queries --log-facility=- --no-resolv --server=10.247.0.1 --local=/tunnel.kibo.test/"]
    cpus: 0.25
    mem_limit: 64m
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.53

  chr-gateway:
    profiles: ["chr"]
    image: alpine:3.20
    command:
      - sh
      - -c
      - >
        apk add --no-cache socat >/dev/null;
        socat TCP-LISTEN:8031,fork,reuseaddr TCP:10.247.0.31:80 &
        socat TCP-LISTEN:8032,fork,reuseaddr TCP:10.247.0.32:80 &
        wait
    cpus: 0.25
    mem_limit: 64m
    ports:
      - "127.0.0.1:58731:8031"
      - "127.0.0.1:58732:8032"
    networks:
      kibo-lab-wan:
        ipv4_address: 10.247.0.40

  coa-relay:
    profiles: ["chr"]
    image: alpine:3.20
    network_mode: "service:freeradius"
    command:
      - sh
      - -c
      - >
        apk add --no-cache socat >/dev/null;
        socat UDP4-LISTEN:3799,fork,reuseaddr UDP4:10.247.0.31:3799 &
        socat UDP4-LISTEN:3800,fork,reuseaddr UDP4:10.247.0.32:3800 &
        wait
    cpus: 0.25
    mem_limit: 64m

volumes:
  kibo-pgdata:
  chr-1-data:
  chr-2-data:

networks:
  kibo-lab-wan:
    name: kibo-lab-wan
    driver: bridge
    ipam:
      config:
        - subnet: 10.247.0.0/24
          gateway: 10.247.0.1
